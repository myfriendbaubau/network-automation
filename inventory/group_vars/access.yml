---
mgmt_svi:
  ACC1:
    vlan: 10
    name: DATA
    ip: 10.0.10.4
    gateway: 10.0.10.1
  ACC2:
    vlan: 20
    name: GUESTS
    ip: 10.0.20.4
    gateway: 10.0.20.1
  ACC3:
    vlan: 30
    name: MGMT
    ip: 10.0.30.4
    gateway: 10.0.30.1
  ACC4:
    vlan: 40
    name: SERVERS
    ip: 10.0.40.4
    gateway: 10.0.40.1

# Ports intended for endpoints. Compliance evaluates every listed interface;
# a single protected port is not enough to mark the switch compliant.
host_facing_ports:
  ACC1: [Ethernet1/0, Ethernet1/1, Ethernet1/2]
  ACC2: [Ethernet1/0, Ethernet1/1, Ethernet1/2]
  ACC3: [Ethernet1/0, Ethernet1/1, Ethernet1/2]
  ACC4: [Ethernet1/0, Ethernet1/1, Ethernet1/2]
