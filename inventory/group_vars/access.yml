---
mgmt_svi:
  ACC1:
    vlan: 30
    name: MGMT
    ip: 10.0.30.5
    gateway: 10.0.30.1
  ACC2:
    vlan: 30
    name: MGMT
    ip: 10.0.30.6
    gateway: 10.0.30.1
  ACC3:
    vlan: 30
    name: MGMT
    ip: 10.0.30.4
    gateway: 10.0.30.1
  ACC4:
    vlan: 30
    name: MGMT
    ip: 10.0.30.7
    gateway: 10.0.30.1

# Client VLANs are intentionally separate from management addressing. After
# the management migration every switch uses VLAN 30 for its SVI, while DHCP
# snooping must continue to protect the VLAN carried by its endpoint ports.
access_vlan:
  ACC1: 10
  ACC2: 20
  ACC3: 30
  ACC4: 40

# Ports intended for endpoints. Compliance evaluates every listed interface;
# a single protected port is not enough to mark the switch compliant.
host_facing_ports:
  ACC1: [Ethernet1/0]
  ACC2: [Ethernet1/0]
  ACC3: [Ethernet1/0]
  ACC4: [Ethernet1/0, Ethernet1/1, Ethernet1/2]

# Administratively unused ports are placed in a local, non-routed parking
# VLAN. ACC4 Ethernet1/1 and Ethernet1/2 are intentionally absent because
# they are active server-facing ports in VLAN 40.
unused_port_policy:
  vlan: 999
  vlan_name: PARKING_LOT
  description: "** UNUSED - parked **"
  vtp_server: DIST1

unused_ports:
  ACC1: [Ethernet1/1, Ethernet1/2, Ethernet1/3]
  ACC2: [Ethernet1/1, Ethernet1/2, Ethernet1/3]
  ACC3: [Ethernet1/1, Ethernet1/2, Ethernet1/3]
  ACC4: [Ethernet1/3]
