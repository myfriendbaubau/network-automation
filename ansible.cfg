[defaults]
vault_password_file  = ~/.vault_pass
inventory            = inventory/hosts.yml
host_key_checking    = False
retry_files_enabled  = False
gathering            = explicit
interpreter_python   = auto_silent

# YAML-formatted task results. This used to be `stdout_callback = yaml`, which
# pointed at the community.general `yaml` callback — removed in
# community.general 12.0.0. `callback_result_format` is the ansible-core
# setting that replaced it (core 2.13+) and needs no collection at all.
callback_result_format = yaml

# Was False. It was set to silence noise, and what it silenced included the
# deprecation notice for the callback above. Warnings that are turned off stop
# being warnings and start being surprises.
deprecation_warnings = True

[persistent_connection]
command_timeout = 60
connect_timeout = 60
