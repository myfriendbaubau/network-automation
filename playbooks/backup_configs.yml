---
# Pull every running configuration, redact it in controller memory, validate
# the sanitized result, and only then write a file that Git is allowed to see.
# Raw module output and intermediate facts use no_log so verbosity cannot print
# credential material into cron or CI logs.

- name: Backup IOS running configurations
  hosts: ios
  gather_facts: false
  any_errors_fatal: true

  vars:
    backup_file: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}.txt"
    redaction_replacement: '\g<1> <REDACTED>'
    ios_scrub_patterns:
      - '(enable secret(?: \d)?) \S+'
      - '(enable password(?: \d)?) \S+'
      - '(username \S+ (?:privilege \d+ )?secret(?: \d)?) \S+'
      - '(username \S+ password(?: \d)?) \S+'
      - '(key-string(?: \d)?) \S+'
      - '(pre-shared-key) \S+'
      - '(snmp-server community) \S+'
    ios_unsafe_patterns:
      - '\$\d\$'
      - '(?i)\b7\s+[0-9A-Fa-f]{10,}\b'
      - '(?im)^enable (?:secret|password)(?! (?:\d+ )?<REDACTED>(?:\s|$))'
      - '(?im)^username \S+ .*?(?:secret|password)(?! (?:\d+ )?<REDACTED>(?:\s|$))'
      - '(?im)^key-string(?! (?:\d+ )?<REDACTED>(?:\s|$))'
      - '(?i)pre-shared-key(?! <REDACTED>(?:\s|$))'
      - '(?im)^snmp-server community(?! <REDACTED>(?:\s|$))'

  tasks:
    - name: Retrieve IOS running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: config
      no_log: true

    - name: Initialise the in-memory IOS backup
      ansible.builtin.set_fact:
        sanitized_config: "{{ config.stdout[0] }}"
      no_log: true

    - name: Redact IOS credential material in memory
      ansible.builtin.set_fact:
        sanitized_config: >-
          {{ sanitized_config
             | regex_replace(item, redaction_replacement, multiline=true) }}
      loop: "{{ ios_scrub_patterns }}"
      no_log: true

    - name: Verify the IOS backup is safe to write
      ansible.builtin.assert:
        that:
          - sanitized_config is not search(item)
        fail_msg: >-
          {{ inventory_hostname }}: credential material survived in-memory
          redaction. Nothing was written or committed.
        quiet: true
      loop: "{{ ios_unsafe_patterns }}"
      no_log: true

    - name: Write the sanitized IOS backup
      ansible.builtin.copy:
        content: "{{ sanitized_config }}\n"
        dest: "{{ backup_file }}"
        mode: '0600'
      delegate_to: localhost

- name: Backup ASA running configuration
  hosts: asa
  gather_facts: false
  any_errors_fatal: true

  vars:
    backup_file: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}.txt"
    redaction_replacement: '\g<1> <REDACTED>'
    asa_scrub_patterns:
      - '(enable password(?: \d)?) \S+'
      - '(username \S+ password(?: \d)?) \S+'
      - '(passwd(?: \d)?) \S+'
      - '(pre-shared-key) \S+'
      - '(: Serial Number:) \S+'
      - '(set peer) \S+'
      - '(tunnel-group) \d+\.\d+\.\d+\.\d+'
    asa_unsafe_patterns:
      - '\$\d\$'
      - '(?im)^enable password(?! (?:\d+ )?<REDACTED>(?:\s|$))'
      - '(?im)^username \S+ .*?password(?! (?:\d+ )?<REDACTED>(?:\s|$))'
      - '(?im)^passwd(?! (?:\d+ )?<REDACTED>(?:\s|$))'
      - '(?i)pre-shared-key(?! <REDACTED>(?:\s|$))'
      - '(?im)^: Serial Number:(?! <REDACTED>(?:\s|$))'
      - '(?i)set peer(?! <REDACTED>(?:\s|$))'
      - '(?im)^tunnel-group(?! <REDACTED>(?:\s|$)) \d+\.\d+\.\d+\.\d+'

  tasks:
    - name: Retrieve ASA running configuration
      cisco.asa.asa_command:
        commands:
          - show running-config
      register: config
      no_log: true

    - name: Initialise the in-memory ASA backup
      ansible.builtin.set_fact:
        sanitized_config: "{{ config.stdout[0] }}"
      no_log: true

    - name: Redact ASA credentials and identifiers in memory
      ansible.builtin.set_fact:
        sanitized_config: >-
          {{ sanitized_config
             | regex_replace(item, redaction_replacement, multiline=true) }}
      loop: "{{ asa_scrub_patterns }}"
      no_log: true

    - name: Verify the ASA backup is safe to write
      ansible.builtin.assert:
        that:
          - sanitized_config is not search(item)
        fail_msg: >-
          {{ inventory_hostname }}: credential or identifier material survived
          in-memory redaction. Nothing was written or committed.
        quiet: true
      loop: "{{ asa_unsafe_patterns }}"
      no_log: true

    - name: Write the sanitized ASA backup
      ansible.builtin.copy:
        content: "{{ sanitized_config }}\n"
        dest: "{{ backup_file }}"
        mode: '0600'
      delegate_to: localhost
