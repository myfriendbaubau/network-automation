---
# Galaxy collections this repository needs.
#
#   ansible-galaxy collection install -r collections/requirements.yml
#
# The project installs ansible-core rather than the batteries-included
# `ansible` package, so every network collection is declared explicitly. A
# freshly built controller therefore gets the same module versions as CI.
#
# Versions are pinned to the set used by the controller and CI. In particular,
# cisco.asa is held on the ansible-core 2.17 compatibility line; upstream does
# not guarantee that collection on newer ansible-core releases.

collections:
  - name: cisco.ios
    version: "11.4.2"
  - name: cisco.asa
    version: "6.1.0"
  - name: ansible.netcommon
    version: "8.6.1"
